name: Unit tests

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

jobs:
  testing:
    runs-on: ubuntu-latest
    env:
      SIGNING_ALIAS: ${{ vars.SIGNING_ALIAS }}
      SIGNING_STORE_PASS: ${{ vars.SIGNING_STORE_PASS }}
      SIGNING_KEY_PASS: ${{ vars.SIGNING_KEY_PASS }}
      SIGNING_KEY_PATH: ${{ vars.SIGNING_KEY_PATH }}
    steps:
    - name: Clone repository
      uses: actions/checkout@v6
    - name: Setup java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Execute tests
      run: |
        ./gradlew test

