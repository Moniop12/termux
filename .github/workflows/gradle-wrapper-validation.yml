name: "Validate Gradle Wrapper"

on:
  push:
    branches:
      - master
      - android-10
  pull_request:
    branches:
      - master
      - android-10

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    env:
      SIGNING_ALIAS: ${{ vars.SIGNING_ALIAS }}
      SIGNING_STORE_PASS: ${{ vars.SIGNING_STORE_PASS }}
      SIGNING_KEY_PASS: ${{ vars.SIGNING_KEY_PASS }}
      SIGNING_KEY_PATH: ${{ vars.SIGNING_KEY_PATH }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@5

